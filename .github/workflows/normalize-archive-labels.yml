name: normalize-archive-labels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'Normalize archive labels') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename versioned files and directories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git mv "versions/V-6B-three-nested-temporal-scales.md" "versions/V01-three-nested-temporal-scales.md"
          git mv "versions/V-6A-representation-experience-and-cosmic-epitaph.md" "versions/V02-representation-experience-and-cosmic-epitaph.md"
          git mv "versions/V-5-nested-timescales-as-causal-trajectory.md" "versions/V03-nested-timescales-as-causal-trajectory.md"
          git mv "versions/V-4-hypnotic-repetition-as-conceptual-embodiment.md" "versions/V04-hypnotic-repetition-as-conceptual-embodiment.md"
          git mv "versions/V-3-recursive-interpretation.md" "versions/V05-recursive-interpretation.md"
          git mv "versions/V-2-listener-participates-in-recursion.md" "versions/V06-listener-participates-in-recursion.md"
          git mv "versions/V-1-unified-recursive-interpretive-framework.md" "versions/V07-unified-recursive-interpretive-framework.md"
          git mv "versions/V-0-six-part-refrain-structural-model.md" "versions/V08-six-part-refrain-structural-model.md"
          git mv "versions/V+1-infinite-jest-structural-resonance.md" "versions/V09-infinite-jest-structural-resonance.md"
          git mv "versions/V+2-recursive-interpretive-system.md" "versions/V10-recursive-interpretive-system.md"
          git mv "versions/V+3-open-ended-machine-successor-and-reader-architecture.md" "versions/V11-open-ended-machine-successor-and-reader-architecture.md"

          git mv "versions/V+1" "versions/V09"
          git mv "versions/V+2" "versions/V10"
          git mv "versions/V+3" "versions/V11"

          git mv "context/version-0-development-notes.md" "context/V08-development-notes.md"
          git mv "context/version-minus-6a-6b-development-notes.md" "context/V01-V02-development-notes.md"

          find . -type f -not -path './.git/*' -not -path './.github/*' -print0 | while IFS= read -r -d '' f; do
            perl -0pi -e 's/V\+3/__V11__/g; s/V\+2/__V10__/g; s/V\+1/__V09__/g; s/V-6A/__V02__/g; s/V-6B/__V01__/g; s/V-6/__V06__/g; s/V-5/__V03__/g; s/V-4/__V04__/g; s/V-3/__V05__/g; s/V-2/__V06__/g; s/V-1/__V07__/g; s/V-0/__V08__/g; s/Version -20/__ORIGINAL__/g; s/Version -10/__REDDIT_SEED__/g; s/Version \+3/__V11__/g; s/Version \+2/__V10__/g; s/Version \+1/__V09__/g; s/Version -6A/__V02__/g; s/Version -6B/__V01__/g; s/Version -6/__V06__/g; s/Version -5/__V03__/g; s/Version -4/__V04__/g; s/Version -3/__V05__/g; s/Version -2/__V06__/g; s/Version -1/__V07__/g; s/Version -0/__V08__/g; s/Version 0/__V08__/g; s/Version 1/__V09__/g; s/Version 2/__V10__/g; s/Version 3/__V11__/g' "$f"
            perl -0pi -e 's/__V11__/V11/g; s/__V10__/V10/g; s/__V09__/V09/g; s/__V08__/V08/g; s/__V07__/V07/g; s/__V06__/V06/g; s/__V05__/V05/g; s/__V04__/V04/g; s/__V03__/V03/g; s/__V02__/V02/g; s/__V01__/V01/g; s/__ORIGINAL__/the true original source/g; s/__REDDIT_SEED__/the original Reddit seed/g' "$f"
          done

          find . -type f -not -path './.git/*' -not -path './.github/*' -print0 | while IFS= read -r -d '' f; do
            perl -0pi -e 's/\bV0\b/V08/g; s/versions\/V11-modular/versions\/V11/g; s/versions\/V10-modular/versions\/V10/g; s/versions\/V09-modular/versions\/V09/g' "$f"
          done

          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          start = s.find('## Version numbering and provenance')
          end = s.find('## Editorial architecture', start)
          if start != -1 and end != -1:
              s = s[:start] + s[end:]
          p.write_text(s)
          PY

          git add -A
          git commit -m "Normalize archive labels and references"
          git push

          rm -f .github/workflows/normalize-archive-labels.yml
          git add -A
          git commit -m "Remove archive normalization workflow"
          git push
