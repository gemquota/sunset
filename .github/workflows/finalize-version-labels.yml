name: finalize-version-labels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize version labels') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace remaining legacy labels
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -type f -not -path './.git/*' -not -path './.github/*' -print0 | while IFS= read -r -d '' f; do
            perl -0pi -e 's/(?<![A-Za-z0-9])(-6B)(?![A-Za-z0-9])/V01/g; s/(?<![A-Za-z0-9])(-6A)(?![A-Za-z0-9])/V02/g; s/(?<![A-Za-z0-9])(-5)(?![A-Za-z0-9])/V03/g; s/(?<![A-Za-z0-9])(-4)(?![A-Za-z0-9])/V04/g; s/(?<![A-Za-z0-9])(-3)(?![A-Za-z0-9])/V05/g; s/(?<![A-Za-z0-9])(-2)(?![A-Za-z0-9])/V06/g; s/(?<![A-Za-z0-9])(-1)(?![A-Za-z0-9])/V07/g; s/(?<![A-Za-z0-9])(-0)(?![A-Za-z0-9])/V08/g; s/(?<![A-Za-z0-9])(\+1)(?![A-Za-z0-9])/V09/g; s/(?<![A-Za-z0-9])(\+2)(?![A-Za-z0-9])/V10/g; s/(?<![A-Za-z0-9])(\+3)(?![A-Za-z0-9])/V11/g' "$f"
          done
          git add -A
          git commit -m "Finalize version labels"
          git push
          rm -f .github/workflows/finalize-version-labels.yml
          git add -A
          git commit -m "Remove label finalization workflow"
          git push
